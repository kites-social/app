  <div class="kwo-device">
    <div class="kwo-status" aria-hidden="true"><span>9:41</span><span class="kwo-status-icons"><span>●●●</span><span>Wi-Fi</span><span>▰</span></span></div>
    <header class="kwo-header">
      <button class="kwo-header-back" type="button" data-action="back" aria-label="Back"><i data-lucide="chevron-left" aria-hidden="true"></i></button>
      <h1 class="kwo-header-title" id="kwo-header-title">Market</h1>

      <button class="kwo-nav-item" type="button" data-nav="feed" aria-label="Feeds"><i data-lucide="cloud" aria-hidden="true"></i><span>Feeds</span></button>
      <button class="kwo-nav-item" type="button" aria-label="Search"><i data-lucide="search" aria-hidden="true"></i><span>Search</span></button>
      <button class="kwo-nav-item" type="button" data-nav="wallet" aria-label="Wallet"><i data-lucide="wallet" aria-hidden="true"></i><span>Wallet</span></button>

  <script src="https://unpkg.com/lucide@1.17.0/dist/umd/lucide.js"></script>
  <script>
    const kwoRoot = document.getElementById("kites-wallet-onboarding");
    const kwoScreen = kwoRoot.querySelector("#kwo-screen");
    const kwoOverlay = kwoRoot.querySelector("#kwo-overlay");
    const kwoHeaderTitle = kwoRoot.querySelector("#kwo-header-title");
    const kwoState = { origin: "trade", mode: "new", step: "entry" };

    function kwoEntryScreen() {
      kwoHeaderTitle.textContent = kwoState.origin === "trade" ? "Market" : "Wallet";
      if (kwoState.origin === "wallet") {
        if (kwoState.step === "done") {
          return `
            <div class="kwo-screen-tabs" role="tablist" aria-label="Wallet sections">
              <button class="kwo-screen-tab" type="button" role="tab" aria-current="page">Balances</button>
              <button class="kwo-screen-tab" type="button" role="tab">Positions</button>
            </div>
            <section class="kwo-balance-placeholder">
              <div>
                <div class="kwo-ready-mark"><i data-lucide="check" aria-hidden="true"></i></div>
                <h2 class="kwo-heading">Wallet ready</h2>
                <p>Your wallet is linked to your Bluesky account. Balances will appear here, grouped by network.</p>
                <div class="kwo-address-card"><div><p class="kwo-address-label">Linked wallet</p><p class="kwo-address">0x71c4…9F24</p></div><i data-lucide="copy" aria-hidden="true"></i></div>
                <button class="kwo-primary" type="button">Deposit funds</button>
              </div>
            </section>`;
        }
        const action = kwoState.mode === "new" ? "Set up wallet" : "Unlock wallet";
        const description = kwoState.mode === "new"
          ? "Set up a passkey wallet to deposit, send funds, and trade. You can keep browsing without one."
          : "Your wallet is linked. Unlock it with your passkey the first time you use it this session.";
        return `
          <div class="kwo-screen-tabs" role="tablist" aria-label="Wallet sections">
            <button class="kwo-screen-tab" type="button" role="tab" aria-current="page">Balances</button>
            <button class="kwo-screen-tab" type="button" role="tab">Positions</button>
          </div>
          <section class="kwo-empty-screen">
            <div class="kwo-empty-icon"><i data-lucide="wallet" aria-hidden="true"></i></div>
            <h2 class="kwo-heading">${kwoState.mode === "new" ? "No wallet is linked to this account yet." : "Your wallet is ready to unlock."}</h2>
            <p class="kwo-description">${description}</p>
            <button class="kwo-primary" type="button" data-action="start">${action}</button>
          </section>`;
      }

      const note = kwoState.step === "done"
        ? "Your wallet is ready. Continue with the trade you started."
        : "Choose an outcome to continue to the trade form.";
      return `
        <section class="kwo-market">
          <p class="kwo-market-kicker">Prediction market</p>
          <h2 class="kwo-market-question">Will ETH close above $4,000 this week?</h2>
          <p class="kwo-market-meta">Ends Friday · 2.4k traders</p>
          <div class="kwo-market-options"><button class="kwo-outcome" type="button">Yes&nbsp;&nbsp; 43¢</button><button class="kwo-outcome" type="button">No&nbsp;&nbsp; 58¢</button></div>
          <p class="kwo-market-note">${note}</p>
        </section>`;
    }

    function kwoSheet() {
      const cancelButton = `<button class="kwo-secondary-action" type="button" data-action="cancel">Not now</button>`;
      let body = "";

      if (kwoState.step === "entry") {
        const title = kwoState.mode === "new" ? "A wallet is needed to trade" : "Unlock your wallet to trade";
        const copy = kwoState.mode === "new"
          ? "Create your Kites wallet once, then use it with the supported trading venues in the app."
          : "Use your passkey to unlock your linked wallet. It will stay ready in memory for this session.";
        const button = kwoState.mode === "new" ? "Set up wallet" : "Unlock with passkey";
        body = `<p class="kwo-eyebrow">${kwoState.mode === "new" ? "Wallet needed" : "Wallet locked"}</p><h2 class="kwo-sheet-title">${title}</h2><p class="kwo-sheet-copy">${copy}</p><div class="kwo-sheet-actions"><button class="kwo-primary" type="button" data-action="start">${button}</button>${cancelButton}</div>`;
      } else if (kwoState.step === "explain") {
        body = `
          <p class="kwo-eyebrow">One-time setup</p>
          <h2 class="kwo-sheet-title">Create your Kites wallet</h2>
          <p class="kwo-sheet-copy">Use a passkey to create and unlock your wallet. Your private key stays on your device, and the same wallet works across supported venues.</p>
          <div class="kwo-privacy-note"><i data-lucide="globe-2" aria-hidden="true"></i><span>Your wallet address will be publicly linked to your Bluesky account so people can find it to send you funds.</span></div>
          <div class="kwo-sheet-actions"><button class="kwo-primary" type="button" data-action="passkey">Continue with passkey</button>${cancelButton}</div>`;
      } else if (kwoState.step === "passkey") {
        body = `
          <p class="kwo-eyebrow">Passkey</p>
          <h2 class="kwo-sheet-title">Create a passkey</h2>
          <p class="kwo-sheet-copy">Use Face ID, Touch ID, or your device screen lock. Your passkey helps unlock your wallet when you need it.</p>
          <div class="kwo-passkey-card"><div class="kwo-passkey-icon"><i data-lucide="fingerprint" aria-hidden="true"></i></div><div><p class="kwo-passkey-title">Kites wallet</p><p class="kwo-passkey-subtitle">Passkey protected</p></div></div>
          <div class="kwo-sheet-actions"><button class="kwo-primary" type="button" data-action="create-passkey">Create passkey</button><button class="kwo-secondary-action" type="button" data-action="back">Back</button></div>`;
      } else if (kwoState.step === "unlock") {
        body = `
          <p class="kwo-eyebrow">Returning wallet</p>
          <h2 class="kwo-sheet-title">Unlock your wallet</h2>
          <p class="kwo-sheet-copy">Use your passkey to unlock your linked wallet. It stays ready in memory for this session, so you won't need to unlock it for every action.</p>
          <div class="kwo-passkey-card"><div class="kwo-passkey-icon"><i data-lucide="fingerprint" aria-hidden="true"></i></div><div><p class="kwo-passkey-title">Kites wallet</p><p class="kwo-passkey-subtitle">Linked to your Bluesky account</p></div></div>
          <div class="kwo-sheet-actions"><button class="kwo-primary" type="button" data-action="unlock-wallet">Unlock with passkey</button>${cancelButton}</div>`;
      } else if (kwoState.step === "link") {
        body = `
          <p class="kwo-eyebrow">Prove ownership</p>
          <h2 class="kwo-sheet-title">Link wallet to Bluesky</h2>
          <div class="kwo-address-card"><div><p class="kwo-address-label">Your new wallet</p><p class="kwo-address">0x71c4…9F24</p></div><i data-lucide="copy" aria-hidden="true"></i></div>
          <p class="kwo-sheet-copy">Sign a one-time proof and publish the link to your Bluesky account. Anyone can see this association and use it to find your wallet address. This does not move funds or pay a network fee.</p>
          <div class="kwo-sheet-actions"><button class="kwo-primary" type="button" data-action="sign-link">Sign and link wallet</button><button class="kwo-secondary-action" type="button" data-action="back">Back</button></div>`;
      } else if (kwoState.step === "ready") {
        body = `
          <div class="kwo-ready-mark"><i data-lucide="check" aria-hidden="true"></i></div>
          <p class="kwo-eyebrow">Wallet ready</p>
          <h2 class="kwo-sheet-title">Your wallet is linked</h2>
          <div class="kwo-address-card"><div><p class="kwo-address-label">Linked wallet</p><p class="kwo-address">0x71c4…9F24</p></div><i data-lucide="copy" aria-hidden="true"></i></div>
          <p class="kwo-sheet-copy">Your wallet is ready. Add funds now, or come back to this later.</p>
          <div class="kwo-sheet-actions"><button class="kwo-primary" type="button" data-action="deposit">Deposit funds</button><button class="kwo-secondary-action" type="button" data-action="finish">Open wallet</button></div>`;
      } else if (kwoState.step === "venue") {
        const venueRows = kwoState.mode === "new"
          ? `<li class="kwo-status-row"><i data-lucide="check-circle-2" aria-hidden="true"></i><span>Passkey wallet created</span></li><li class="kwo-status-row"><i data-lucide="check-circle-2" aria-hidden="true"></i><span>Wallet linked to Bluesky</span></li><li class="kwo-status-row"><i data-lucide="check-circle-2" aria-hidden="true"></i><span>Venue account ready</span></li>`
          : `<li class="kwo-status-row"><i data-lucide="check-circle-2" aria-hidden="true"></i><span>Wallet unlocked for this session</span></li><li class="kwo-status-row"><i data-lucide="check-circle-2" aria-hidden="true"></i><span>Venue account ready</span></li>`;
        body = `
          <div class="kwo-ready-mark"><i data-lucide="check" aria-hidden="true"></i></div>
          <p class="kwo-eyebrow">Ready to trade</p>
          <h2 class="kwo-sheet-title">Your trade is ready</h2>
          <p class="kwo-sheet-copy">Kites prepared this venue in the background. You stay in Kites and use the same wallet; there is no separate venue signup.</p>
          <ul class="kwo-status-list">${venueRows}</ul>
          <div class="kwo-sheet-actions"><button class="kwo-primary" type="button" data-action="finish">Return to trade</button></div>`;
      } else if (kwoState.step === "unlocked") {
        body = `
          <div class="kwo-ready-mark"><i data-lucide="check" aria-hidden="true"></i></div>
          <p class="kwo-eyebrow">Wallet unlocked</p>
          <h2 class="kwo-sheet-title">You're ready to continue</h2>
          <p class="kwo-sheet-copy">Your wallet stays available in memory for this session, so you won't be asked to unlock it for every action.</p>
          <div class="kwo-sheet-actions"><button class="kwo-primary" type="button" data-action="unlocked-continue">${kwoState.origin === "trade" ? "Continue to trade" : "Open wallet"}</button></div>`;
      }

      return `<div class="kwo-scrim"></div><section class="kwo-sheet" role="dialog" aria-modal="true"><div class="kwo-sheet-handle"></div>${body}</section>`;
    }

    function kwoRender() {
      for (const button of kwoRoot.querySelectorAll("[data-origin]")) {
        button.setAttribute("aria-pressed", String(button.dataset.origin === kwoState.origin));
      }
      for (const button of kwoRoot.querySelectorAll("[data-mode]")) {
        button.setAttribute("aria-pressed", String(button.dataset.mode === kwoState.mode));
      }
      for (const button of kwoRoot.querySelectorAll("[data-nav]")) {
        if (button.dataset.nav === (kwoState.origin === "trade" ? "feed" : "wallet")) {
          button.setAttribute("aria-current", "page");
        } else {
          button.removeAttribute("aria-current");
        }
      }

      if (kwoState.step === "entry" || kwoState.step === "done" || kwoState.step === "dismissed") {
        kwoScreen.innerHTML = kwoEntryScreen();
        kwoOverlay.innerHTML = kwoState.step === "entry" && kwoState.origin === "trade" ? kwoSheet() : "";
      } else if (kwoState.step === "venue" || kwoState.step === "unlocked") {
        kwoScreen.innerHTML = kwoEntryScreen();
        kwoOverlay.innerHTML = kwoSheet();
      } else {
        kwoScreen.innerHTML = kwoEntryScreen();
        kwoOverlay.innerHTML = kwoSheet();
      }

      const hasBackStep = ["explain", "passkey", "link", "unlock"].includes(kwoState.step);
      kwoRoot.querySelector(".kwo-header-back").style.display = hasBackStep ? "inline-flex" : "none";
      if (globalThis.lucide) globalThis.lucide.createIcons({ attrs: { width: 18, height: 18 } });
    }

    kwoRoot.addEventListener("click", (event) => {
      const button = event.target.closest("button");
      if (!button) return;

      if (button.dataset.origin) {
        kwoState.origin = button.dataset.origin;
        kwoState.step = "entry";
      } else if (button.dataset.mode) {
        kwoState.mode = button.dataset.mode;
        kwoState.step = "entry";
      } else if (button.dataset.action === "start") {
        kwoState.step = kwoState.mode === "new" ? "explain" : "unlock";
      } else if (button.dataset.action === "passkey") {
        kwoState.step = "passkey";
      } else if (button.dataset.action === "create-passkey") {
        kwoState.step = "link";
      } else if (button.dataset.action === "sign-link") {
        kwoState.step = kwoState.origin === "trade" ? "venue" : "ready";
      } else if (button.dataset.action === "unlock-wallet") {
        kwoState.step = kwoState.origin === "trade" ? "venue" : "unlocked";
      } else if (button.dataset.action === "unlocked-continue") {
        kwoState.step = kwoState.origin === "trade" ? "venue" : "done";
      } else if (button.dataset.action === "deposit") {
        kwoState.step = "done";
      } else if (button.dataset.action === "finish") {
        kwoState.step = "done";
      } else if (button.dataset.action === "cancel") {
        kwoState.step = "dismissed";
      } else if (button.dataset.action === "back") {
        const backSteps = { explain: "entry", passkey: "explain", link: "passkey" };
        kwoState.step = backSteps[kwoState.step] ?? "entry";
      } else if (button.classList.contains("kwo-outcome")) {
        if (kwoState.mode === "new") kwoState.step = "explain";
        else kwoState.step = "unlock";
      }
      kwoRender();
    });

    kwoRender();
  </script>
</div>
